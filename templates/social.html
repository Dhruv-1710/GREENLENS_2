<script>
let uid = null;
const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><rect width='96' height='96' rx='48' fill='#10b981'/><circle cx='48' cy='38' r='15' fill='white' opacity='0.92'/><path d='M20 86c5-19 17-27 28-27s23 8 28 27z' fill='white' opacity='0.92'/></svg>");

let limit = 5;
let offset = 0;
let hasMore = true;


checkAuth();
// Re-verify on back/forward-cache restore (belt-and-suspenders with the
// server-side no-store guard) so a cached page can never show without login
window.addEventListener("pageshow", function(e){ if(e.persisted) checkAuth(); });

async function checkAuth() {
    let data;
    try {
        const res = await fetch("/api/auth/me", { cache: "no-store" });
        data = await res.json();
    } catch(e) {
        window.location.replace("/auth"); return;
    }

    if (!data.user) {
        window.location.replace("/auth");   // replace() so back button can't return here
        return;
    }

    uid = data.user;

    syncUser();
    checkAdmin();
    loadPosts();
    loadEvents();
    loadNotifications();
    loadUnreadCount();

    setInterval(loadNotificationsDropdown, 5000);
    setInterval(loadUnreadCount, 3000);
    setInterval(()=>loadPosts(false), 3000);

    loadMiniProfile();
}

function formatTime(ts) {
    if (!ts) return "";

    const past = new Date(ts + "Z"); // force UTC
    const now = new Date();

    const diff = Math.floor((now - past) / 1000);

    if (diff < 60) return "Just now";
    if (diff < 3600) return Math.floor(diff/60) + " min ago";
    if (diff < 86400) return Math.floor(diff/3600) + " hr ago";
    return Math.floor(diff/86400) + " days ago";
}

// =======================
// SYNC USER
// =======================

async function syncUser() {
    const res = await fetch("/api/auth/me");
    const data = await res.json();

    if (!data.user) return;

    await fetch("/api/sync-user", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            uid: data.user   // 👈 username removed
        })
    });
}

// CREATE POST

async function createPost(){

    const content = document.getElementById("postInput").value;
    const image = document.getElementById("imageInput").files[0];

    if(!content && !image){
        alert("Write something or upload image");
        return;
    }

    const formData = new FormData();
    formData.append("uid", uid);
    formData.append("content", content);

    if(image){
        formData.append("image", image);
    }

    const res = await fetch("/api/posts",{
        method:"POST",
        body:formData
    });

    const data = await res.json();

    if(data.status){
        document.getElementById("postInput").value = "";
        document.getElementById("imageInput").value = "";

        loadPosts(); // refresh feed
    }
}

async function checkAdmin(){

    const res = await fetch("/api/auth/me");
    const data = await res.json();

    if(!data.user) return;

    const userRes = await fetch("/api/user/"+data.user);
    const user = await userRes.json();

    if(user.is_admin){
        document.getElementById("adminLink").style.display="inline";
    }

}

// =======================
// LOAD POSTS
// =======================

async function loadPosts(reset = true) {

    if (reset) {
        offset = 0;
        hasMore = true;
        document.getElementById("feed").innerHTML = "";
    }

    if (!hasMore) return;

    const res = await fetch(`/api/feed/${uid}?limit=${limit}&offset=${offset}`);
    const data = await res.json();

    const posts = data.posts;
    hasMore = data.has_more;

    const feed = document.getElementById("feed");

    posts.forEach(post => {
        const div = document.createElement("div");
        div.className = "post";
        div.id = "post-" + post.id;

        let postHTML = "";

        if (!post.is_repost) {
            postHTML = `
            <div class="post-card">

                <div class="post-header" onclick="openProfileFromFeed('${post.uid}')">
                    <img src="${post.avatar || DEFAULT_AVATAR}" class="post-avatar">

                    <div>
                        <div class="post-author">${post.author}</div>
                        <div class="post-time">${formatTime(post.timestamp)}</div>
                    </div>
                </div>

                <div class="post-content">
                    ${post.content}
                </div>

                ${post.image_url ? 
                    `<img src="${post.image_url}" class="post-image">` 
                    : ""}

                <div class="post-stats">
                    ❤️ <span id="like-${post.id}">${post.likes}</span>
                    &nbsp;&nbsp; 🔁 ${post.shares}
                </div>

                <div class="post-actions">
                    <button onclick="toggleLike(${post.id})">👍 Like</button>
                    <button onclick="showRepostBox(${post.id})">🔁 Repost</button>
                    <button onclick="sharePost(${post.id})">📤 Share</button>
                </div>

                <div id="repostBox-${post.id}" style="display:none; margin-top:10px;">
                    <textarea id="repostInput-${post.id}" style="width:100%;" placeholder="Add your thoughts..."></textarea>
                    <button onclick="submitRepost(${post.id})">Share</button>
                    <button onclick="hideRepostBox(${post.id})">Cancel</button>
                </div>

                <div id="comments-${post.id}"></div>

                <input id="commentInput-${post.id}" placeholder="Write comment">
                <button onclick="addComment(${post.id})">Comment</button>

            </div>
            `;
            


        } else {
            const original = post.original;

            postHTML = `
                <b>${post.author}</b> reposted
                <small> • ${formatTime(post.timestamp)}</small>
                <hr>
                ${
                    original ? `
                        <b>${original.author}</b>
                        <small> • ${formatTime(original.timestamp)}</small>
                        <br>
                        ${original.content}
                    ` : `<i>Original not available</i>`
                }
            `;
        }

        div.innerHTML = postHTML;
        if(!document.getElementById("post-"+post.id)){
            feed.appendChild(div);
        }
        if (!post.is_repost) {
            loadComments(post.id);
        }
    });

    offset += limit;

    renderLoadMore();
}

// EDIT POST

function enableEdit(pid) {
    document.getElementById("content-" + pid).style.display = "none";
    document.getElementById("editArea-" + pid).style.display = "block";
}

function cancelEdit(pid) {
    document.getElementById("content-" + pid).style.display = "block";
    document.getElementById("editArea-" + pid).style.display = "none";
}

async function savePost(pid) {
    const content = document.getElementById("editInput-" + pid).value;

    await fetch("/api/posts/" + pid, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            uid: uid,
            content: content
        })
    });

    document.getElementById("content-" + pid).innerText = content;
    cancelEdit(pid);
}

async function deletePost(pid) {
    if (!confirm("Delete this post?")) return;

    await fetch("/api/posts/" + pid, {
        method: "DELETE",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({uid: uid})
    });

    loadPosts();
}

// =======================
// LIKE
// =======================

async function toggleLike(pid) {
    const res = await fetch("/api/posts/like/" + pid, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({uid: uid})
    });

    const data = await res.json();
    document.getElementById("like-" + pid).innerText = data.likes;
}

function showRepostBox(pid) {
    document.getElementById("repostBox-" + pid).style.display = "block";
}

function hideRepostBox(pid) {
    document.getElementById("repostBox-" + pid).style.display = "none";
}

async function submitRepost(pid) {
    const thought = document.getElementById("repostInput-" + pid).value;

    await fetch("/api/posts/repost/" + pid, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ uid, thought })
    });

    loadPosts();
}
// =======================
// LOAD COMMENTS
// =======================

async function loadComments(pid) {
    const res = await fetch("/api/comments/" + pid);
    const comments = await res.json();

    const box = document.getElementById("comments-" + pid);
    box.innerHTML = "";

    comments.forEach(c => {
        const div = document.createElement("div");
        div.className = "comment";

        div.innerHTML = `
            <div id="commentText-${c.id}">
                <b>${c.author}</b>
                <small> • ${formatTime(c.timestamp)}</small>
                : ${c.text}
            </div>

            <div id="commentEdit-${c.id}" style="display:none;">
                <textarea id="commentInputEdit-${c.id}" style="width:90%">${c.text}</textarea>
                <button onclick="saveComment(${c.id}, ${pid})">Save</button>
                <button onclick="cancelCommentEdit(${c.id})">Cancel</button>
            </div>

            ${c.uid === uid ? `
                <button onclick="enableCommentEdit(${c.id})">Edit</button>
                <button onclick="deleteComment(${c.id}, ${pid})">Delete</button>
            ` : ""}
        `;

        box.appendChild(div);
    });
}

// =======================
// COMMENT EDIT
// =======================

function enableCommentEdit(cid) {
    document.getElementById("commentText-" + cid).style.display = "none";
    document.getElementById("commentEdit-" + cid).style.display = "block";
}

function cancelCommentEdit(cid) {
    document.getElementById("commentText-" + cid).style.display = "block";
    document.getElementById("commentEdit-" + cid).style.display = "none";
}

async function saveComment(cid, pid) {
    const text = document.getElementById("commentInputEdit-" + cid).value;

    await fetch("/api/comments/" + cid, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            uid: uid,
            text: text
        })
    });

    loadComments(pid);
}

async function deleteComment(cid, pid) {
    if (!confirm("Delete this comment?")) return;

    await fetch("/api/comments/" + cid, {
        method: "DELETE",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({uid: uid})
    });

    loadComments(pid);
}

// =======================
// ADD COMMENT
// =======================

async function addComment(pid) {
    const input = document.getElementById("commentInput-" + pid);
    const text = input.value;

    if (!text) return;

    await fetch("/api/comments/" + pid, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            uid: uid,
            text: text
        })
    });

    input.value = "";
    loadComments(pid);
}

/* ================= PAGINATION HELPER ================= */

function renderLoadMore() {
    const btn = document.getElementById("loadMoreBtn");
    if (!btn) return;   // safety guard
    btn.style.display = hasMore ? "inline-block" : "none";
}

// ================= NAVBAR FUNCTIONS =================

async function logout(){
    await fetch("/api/auth/logout");
    try { localStorage.clear(); } catch(e) {}
    window.location.replace("/auth");
}


async function loadNotificationsDropdown(){

    const box = document.getElementById("notifDropdown");
    if(!box) return;

    const res = await fetch("/api/notifications/" + uid);
    const data = await res.json();

    if(box.style.display !== "block") return; // dropdown open ho tabhi update

    box.innerHTML = "<b>Notifications</b><hr>";

    if(data.length === 0){
        box.innerHTML += "No notifications";
        return;
    }

    data.forEach(n=>{

        let text="";
        let clickAction="";

        if(n.type==="like"){
            text="liked your post ❤️";
            clickAction=`openPostFromNotification(${n.post_id})`;
        }

        if(n.type==="comment"){
            text="commented on your post 💬";
            clickAction=`openPostFromNotification(${n.post_id})`;
        }

        if(n.type==="repost"){
            text="reposted your post 🔁";
            clickAction=`openPostFromNotification(${n.post_id})`;
        }

        if(n.type==="connect_request"){
            text="sent you a connection request 🤝";
            clickAction=`openProfileFromNotification('${n.sender}')`;
        }

        if(n.type==="connect_accept"){
            text="accepted your connection 🎉";
            clickAction=`openProfileFromNotification('${n.sender}')`;
        }

        const unreadClass = !n.is_read ? "unread-notif" : "";

        box.innerHTML += `
        <div class="notif-item ${unreadClass}">
            <div style="display:flex;justify-content:space-between;align-items:center">

                <div onclick="${clickAction}" style="cursor:pointer;">
                    <b>${n.sender}</b> ${text}
                </div>

                <span onclick="deleteNotification(${n.id})"
                style="cursor:pointer;color:#888;font-weight:bold;">✖</span>

            </div>
        </div>
        `;
    });
}

async function toggleNotif(){

    const box = document.getElementById("notifDropdown");

    // 🛟 safety guard (very important)
    if(!box) return;

    // toggle close
    if(box.style.display === "block"){
        box.style.display = "none";
        return;
    }

    const res = await fetch("/api/notifications/" + uid);
    const data = await res.json();

    box.innerHTML = "<b>Notifications</b><hr>";

    if(data.length === 0){
        box.innerHTML += "No notifications";
    }

    data.forEach(n=>{

        const unreadClass = !n.is_read ? "unread-notif" : "";

        let text = "";
        let clickAction = "";

    if(n.type==="like"){
        text = "liked your post ❤️";
        clickAction = `openPostFromNotification(${n.post_id})`;
    }

    if(n.type==="comment"){
        text = "commented on your post 💬";
        clickAction = `openPostFromNotification(${n.post_id})`;
    }

    if(n.type==="repost"){
        text = "reposted your post 🔁";
        clickAction = `openPostFromNotification(${n.post_id})`;
    }

    if(n.type==="connect_request"){
        text = "sent you a connection request 🤝";
        clickAction = `openProfileFromNotification('${n.sender}')`;
    }

    if(n.type==="connect_accept"){
        text = "accepted your connection 🎉";
        clickAction = `openProfileFromNotification('${n.sender}')`;
    }

    box.innerHTML += `
    <div class="notif-item ${unreadClass}">

        <div style="display:flex; justify-content:space-between; align-items:center;">

            <div onclick="${clickAction}" style="cursor:pointer;">
                <b>${n.sender}</b> ${text}
            </div>

            <span onclick="deleteNotification(${n.id})"
            style="cursor:pointer; color:#888; font-weight:bold;">
            ✖
            </span>

        </div>

    </div>
    `;
});

    box.style.display = "block";

    // ⭐ mark notifications as read
    await fetch("/api/notifications/read/" + uid, {method:"POST"});

    // ⭐ refresh unread badge
    loadUnreadCount();
}

    }

// =======================
// LOAD EVENTS SIDEBAR
// =======================

async function loadEvents(){
    const res = await fetch("/api/events");
    const events = await res.json();

    const box = document.getElementById("eventsBox");
    box.innerHTML = "";

    if(events.length === 0){
        box.innerHTML = "No upcoming events";
        return;
    }

    events.forEach(e=>{
        box.innerHTML += `
            <div style="margin-bottom:12px;">
                <b>${e.title}</b><br>
                <small>${new Date(e.date+"Z").toDateString()}</small><br>
                <small>${e.location}</small>
                <hr>
            </div>
        `;
    });
}

// =======================
// LOAD UNREAD COUNT (🔔 number)
// =======================
async function loadUnreadCount(){

    const bell = document.getElementById("notifBell");
    const badge = document.getElementById("notifBadge");

    // safety guard (other pages me navbar nahi hota)
    if(!bell || !badge) return;

    const res = await fetch("/api/notifications/" + uid);
    const data = await res.json();

    const unread = data.filter(n => !n.is_read).length;

    updateBadge(unread);
}


// ================= GLOBAL NAV SEARCH =================
async function navSearchUsers(){
    const query = document.getElementById("navSearch").value;
    const box = document.getElementById("navSearchResults");

    if(!query){
        box.style.display="none";
        return;
    }

    // session uid fetch
    const resUser = await fetch("/api/auth/me");
    const userData = await resUser.json();
    const uid = userData.user;

    const res = await fetch(`/api/users/search/${query}/${uid}`);
    const users = await res.json();

    box.innerHTML="";
    box.style.display="block";

    users.forEach(u=>{
        box.innerHTML += `
            <div style="padding:6px; cursor:pointer;"
                 onclick="openProfile('${u.uid}')">
                <b>${u.name}</b><br>
                <small>${u.bio}</small>
            </div>
            <hr>
        `;
    });
}

function openProfile(uid){
    window.location.href="/profile.html?uid="+uid;
}

// click outside → close dropdown
document.addEventListener("click", function(e){
    if(!e.target.closest("#navSearch")){
        const box=document.getElementById("navSearchResults");
        if(box) box.style.display="none";
    }
});

// ===== MINI PROFILE LOAD =====
async function loadMiniProfile(){
    const res = await fetch("/api/auth/me");
    const data = await res.json();
    if(!data.user) return;

    const uid = data.user;
    const userRes = await fetch("/api/user/" + uid);
    const user = await userRes.json();

    document.getElementById("miniAvatar").src = user.avatar || DEFAULT_AVATAR;
    document.getElementById("miniName").innerText = user.name;
    document.getElementById("miniBio").innerText = user.bio;
}

// ================= SHARE POST =================
function sharePost(postId){

    const url = window.location.origin + "/community#post-" + postId;
    const text = "Check this post on GreenLens 🌱";

    // mobile share (best UX)
    if(navigator.share){
        navigator.share({
            title:"GreenLens Post",
            text:text,
            url:url
        });
        return;
    }

    // desktop fallback
    const shareLinks = `
Share this post:

LinkedIn:
https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}

Twitter:
https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}

WhatsApp:
https://wa.me/?text=${encodeURIComponent(text+" "+url)}
    `;

    alert(shareLinks);
}
