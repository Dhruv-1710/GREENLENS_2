<!DOCTYPE html>
<html>
<head>
    <title>GreenLens Login</title>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/favicon.ico">

    <style>

        body{
            font-family:system-ui,Arial;
            max-width:400px;
            margin:auto;
            padding:40px;
            background:linear-gradient(#ecfdf5,#f0fdf4);
        }

        h2{
            text-align:center;
        }

        .card{
            border:1px solid #ccc;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            background:white;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:10px;
            border-radius:6px;
            border:1px solid #ccc;
        }

        button{
            width:100%;
            padding:10px;
            border:none;
            border-radius:6px;
            background:#10b981;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#059669;
        }


        .strength-bar {
            height: 5px;
            border-radius: 3px;
            margin-bottom: 8px;
            transition: 0.3s;
        }
        .strength-text { font-size: 12px; margin-bottom: 8px; }
        .error-msg { color: #ef4444; font-size: 13px; margin-bottom: 8px; }
        .success-msg { color: #10b981; font-size: 13px; margin-bottom: 8px; }
    </style>
</head>

<body>

<h2>🌱 GreenLens</h2>

<!-- LOGIN -->

<div class="card">

<h3>Login</h3>

<input id="loginEmail" placeholder="Email">

<input id="loginPassword" type="password" placeholder="Password">

<div id="loginMsg"></div>
<button onclick="login()">Login</button>

</div>


<!-- SIGNUP -->

<div class="card">

<h3>Signup</h3>

<input id="signupName" placeholder="Name">

<input id="signupEmail" placeholder="Email">

<input id="signupPassword" type="password" placeholder="Password (min 8 chars, A-Z, 0-9, !@#$)" oninput="checkStrength(this.value)">
<div class="strength-bar" id="strengthBar" style="background:#eee;width:0%"></div>
<div class="strength-text" id="strengthText"></div>

<div id="signupMsg"></div>
<button onclick="signup()">Create Account</button>

</div>


<script>

/* ================= SESSION CHECK ================= */

checkSession();

async function checkSession(){

    const res = await fetch("/api/auth/me");
    const data = await res.json();

    if(!data.user) return;

    const userRes = await fetch("/api/user/" + data.user);
    const user = await userRes.json();

    if(user.is_admin){
        window.location.href="/admin.html";
    }else{
        window.location.href="/community";
    }

}


/* ================= LOGIN ================= */

async function login(){

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const res = await fetch("/api/auth/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email,password})
    });

    const data = await res.json();

    if(data.error){
        showMsg("loginMsg", data.error, "error");
        return;
    }

    localStorage.setItem("uid",data.uid);
    localStorage.setItem("name",email.split("@")[0]);

    if(data.is_admin){
        window.location.href="/admin.html";
    }else{
        window.location.href="/community";
    }

}


/* ================= SIGNUP ================= */

function checkStrength(pwd) {
    let score = 0;
    if (pwd.length >= 8) score++;
    if (/[A-Z]/.test(pwd)) score++;
    if (/[0-9]/.test(pwd)) score++;
    if (/[!@#$%^&*(),.?":{}|<>]/.test(pwd)) score++;

    const bar = document.getElementById("strengthBar");
    const text = document.getElementById("strengthText");

    const levels = [
        { color: "#ef4444", label: "Bahut kamzor", width: "25%" },
        { color: "#f97316", label: "Kamzor", width: "50%" },
        { color: "#eab308", label: "Theek hai", width: "75%" },
        { color: "#10b981", label: "Mazboot! ✅", width: "100%" }
    ];

    if (pwd.length === 0) {
        bar.style.width = "0%";
        text.innerText = "";
        return;
    }

    const level = levels[Math.min(score - 1, 3)] || levels[0];
    bar.style.background = level.color;
    bar.style.width = level.width;
    text.style.color = level.color;
    text.innerText = level.label;
}

async function signup(){

    const name = document.getElementById("signupName").value;
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;

    const res = await fetch("/api/auth/signup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name,email,password})
    });

    const data = await res.json();

    if(data.error){
        showMsg("signupMsg", data.error, "error");
        return;
    }

    localStorage.setItem("uid",data.uid);
    localStorage.setItem("name",name);

    if(email === "admin@greenlens.com"){
        window.location.href="/admin.html";
    }else{
        window.location.href="/community";
    }

}


function showMsg(id, msg, type) {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerText = msg;
    el.className = type === "error" ? "error-msg" : "success-msg";
}
</script>

</body>
</html>
